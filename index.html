<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcultor</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="calculator.css">
</head>
<body>
    <!DOCTYPE html> 
<html> 

<head> 
	<title>HTML Calculator</title> 
</head> 

<body> 
	<div class="main-body">
		<div class="cal">
			<div class="output-screen">
				<input type="text" id="output" name="" id="">
			</div>
			<div class="buttons">
				<div class="row">
					<button onclick="btnclick(9)" class="btn-click">9</button>
					<button onclick="btnclick(8)" class="btn-click">8</button>
					<button onclick="btnclick(7)" class="btn-click">7</button>
					<button onclick="Clickclear()" class="btn-click-clear">Clear</button>
				</div>
				<div class="row">
					<button onclick="btnclick(4)" class="btn-click">4</button>
					<button onclick="btnclick(5)" class="btn-click">5</button>
					<button onclick="btnclick(6)" class="btn-click">6</button>
					<button onclick="total()" class="btn-click-total">=</button>
				</div>
				<div class="row">
					<button onclick="btnclick(3)" class="btn-click">3</button>
					<button onclick="btnclick(2)" class="btn-click">2</button>
					<button onclick="btnclick(1)" class="btn-click">1</button>
					<button onclick="btnclick(0)" class="btn-click">0</button>
				</div>
				<div class="row">
					<button onclick="btnclick('-')" class="btn-click">-</button>
					<button onclick="btnclick('+')" class="btn-click">+</button>
					<button onclick="btnclick('/')" class="btn-click">/</button>
					<button onclick="btnclick('*')" class="btn-click">*</button>
				</div>

			</div>
		</div>
	</div>
</body> 
</html> 
</body>
<script src="jsCalculator.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</html>
